spring.application.name=jobBoard

spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Security
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
# Aggregator
aggregator.enabled=${AGGREGATOR_ENABLED:false}
aggregator.run-on-startup=false
aggregator.cron=0 0 */3 * * *
aggregator.stale-days=14
aggregator.max-details-per-run=300
aggregator.hh.text=java
aggregator.hh.professional-roles=96
aggregator.hh.user-agent=${HH_USER_AGENT:jobBoard-aggregator/1.0 (jobboard@example.com)}
aggregator.hh.token=${HH_TOKEN:}
