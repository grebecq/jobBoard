services:
  - type: web
    name: jobboard-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/dictionaries
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://grebecq.github.io
